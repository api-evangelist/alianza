telecom_regulatory:
  note: >-
    Alianza operates in US telecommunications, so several sector obligations are visible in the API
    surface itself. These are observed capabilities, not certifications claimed by Alianza.
  observed:
    - id: e911
      evidence: 'E911 / emergency callback number fields appear across device, line and user schemas (e911CallbackNumber, emergencyCallbackPhoneNumber, E911CallBack); an Emergency Notification tag exists'
    - id: lnp-number-porting
      evidence: 'a full Port tag implements LNP: port request creation, LOA upload and retrieval, validation and activation'
    - id: robocall-mitigation
      evidence: 'Alianza markets robocall blocking as a platform capability (https://www.alianza.com/use-cases/robocall-blocking/); no STIR/SHAKEN attestation field is exposed in the public API description'
    - id: cdr-retention
      evidence: 'CDRs are exported over SFTP datafeeds and searchable via the CDRs tag'

