aid: alianza
name: Alianza
description: 'Alianza is a cloud communications software company founded in 2009 and
  headquartered in Utah, providing a full-stack cloud voice and communications platform
  to more than 1,000 communications service providers across 81 countries. Its Intelligent
  Communications Fabric spans an experience layer, an orchestration layer, and an infrastructure
  layer, packaged as Alianza One (multi-tenant cloud voice), Alianza Core (physical,
  virtual and containerized network functions including MetaSphere, MaX UC, Perimeta
  SBC and Clearwater Core IMS), and Alianza Fusion (hosted core communications systems).
  Service providers use the platform for residential voice, business cloud communications,
  SIP trunking, business lines, managed specialty lines (POTS replacement), business
  text messaging, contact center, Microsoft Teams Direct Routing, robocall blocking
  and voice interconnect. The Alianza Public API is a JSON REST API over the Alianza
  One platform covering partition, account, end user, device, telephone number, porting,
  SIP trunk, calling plan, voicemail, CDR and reporting orchestration.'
