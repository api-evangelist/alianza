apis:
- aid: alianza:alianza-public-api
  name: Alianza Public API
  description: 'The Alianza Public API is the JSON REST web-service layer over the
    Alianza One cloud communications platform. Service providers use it to create and
    control every aspect of end-user accounts: partitions and accounts, account users
    and end users, devices and device lines, business lines and hunt groups, SIP trunks
    and trunk groups, calling plans and products, telephone numbers, porting and number
    activation, specialty lines, voicemail boxes and messages, IVR, call/paging/pickup
    groups, virtual fax, SSO configuration, security groups, bulk operations, CDRs
    and reporting. Authentication is a token obtained from POST /v2/authorize and sent
    on the X-AUTH-TOKEN header. The published OpenAPI 3.0.3 description covers 315
    paths and 471 operations across 57 tags.'
