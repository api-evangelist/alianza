api_client_sdks:
  found: false
  note: >-
    Alianza publishes NO first-party client library for the Alianza Public API in any registry.
    npm, PyPI, RubyGems, Packagist, NuGet and crates.io were all searched and returned no Alianza
    API client. The developer portal ships PDF integration guides and a Swagger UI console instead
    of SDKs, and the OpenAPI 3.0.3 description is the only machine-readable client-generation
    input. Because no official client library exists, no SDKs pointer is emitted in apis.yml.

