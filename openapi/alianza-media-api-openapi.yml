        in: path
        description: ID of Hold Music Media
        required: true
        schema:
          type: string
      responses:
        default:
          description: successful operation
      responsesObject:
        default:
          description: successful operation
      deprecated: true
  /v2/partition/{partitionId}/account/{accountId}/media_2:
    post:
      tags:
      - Media
      summary: Upload IVR Prompt or Account Hold Music
      description: 'Use to add an IVR Prompt (use file upload to submit a wav file).

        Use to add Hold Music (use the job service, then submit the jobUploadKey for the wav, mp3, ogg already uploaded)'
      operationId: uploadAccountMedia
      parameters:
      - name: X-AUTH-TOKEN
        in: header
        required: false
        schema:
          type: string
      - name: partitionId
        in: path
        description: ID of partition
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        description: ID of account
        required: true
        schema:
          type: string
      - name: jobUploadKey
        in: query
        description: Provide an upload key (Use for Hold Music)
        required: false
        schema:
          type: string
      responses:
        '400':
          description: Invalid ID supplied
        '404':
          description: Account not found
        '200':
          description: Processed the IVR Prompt file upload
          responseSchema:
            originalRef: MediaX
            $ref: '#/components/schemas/MediaX'
          content:
            application/json:
              schema:
                originalRef: MediaX
                $ref: '#/components/schemas/MediaX'
        '202':
          description: When providing a file upload key. The key has been accepted and the asynchronous process has started
          responseSchema:
            originalRef: Job
            $ref: '#/components/schemas/Job_2'
          content:
            application/json:
              schema:
                originalRef: Job
                $ref: '#/components/schemas/Job_2'
      responsesObject:
        '400':
          description: Invalid ID supplied
        '404':
          description: Account not found
        '200':
          description: Processed the IVR Prompt file upload
          responseSchema:
            originalRef: MediaX
            $ref: '#/components/schemas/MediaX'
          schema:
            originalRef: MediaX
            $ref: '#/components/schemas/MediaX'
        '202':
          description: When providing a file upload key. The key has been accepted and the asynchronous process has started
          responseSchema:
            originalRef: Job
            $ref: '#/components/schemas/Job_2'
          schema:
            originalRef: Job
            $ref: '#/components/schemas/Job_2'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: Wave File to upload. (Use for IVR prompt)
                  format: binary
  /v2/partition/{partitionId}/account/{accountId}/media_2/type/holdmusic:
    get:
      tags:
      - Media
      summary: Retrieve Hold Music Media ID.
      description: Use to retrieve Hold Music Media ID
      operationId: getAccountHoldMusic
      parameters:
      - name: X-AUTH-TOKEN
        in: header
        required: false
        schema:
          type: string
      - name: partitionId
        in: path
        description: ID of partition
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        description: ID of account
        required: true
        schema:
          type: string
      - name: custom
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: successful operation
          responseSchema:
            originalRef: HoldMusicX
            $ref: '#/components/schemas/HoldMusicX'
          content:
            application/json:
              schema:
                originalRef: HoldMusicX
                $ref: '#/components/schemas/HoldMusicX'
      responsesObject:
        '200':
          description: successful operation
          responseSchema:
            originalRef: HoldMusicX
            $ref: '#/components/schemas/HoldMusicX'
          schema:
            originalRef: HoldMusicX
            $ref: '#/components/schemas/HoldMusicX'
    delete:
      tags:
      - Media
      summary: Remove the hold music media selection for this account
      description: Used to remove an existing media storage id that is used to play hold music for this account.
      operationId: deleteAccountMusicOnHold
      parameters:
      - name: X-AUTH-TOKEN
        in: header
        required: false
        schema:
          type: string
      - name: partitionId
        in: path
        description: ID of partition
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        description: ID of account
        required: true
        schema:
          type: string
      responses:
        default:
          description: successful operation
      responsesObject:
        default:
          description: successful operation
  /v2/partition/{partitionId}/account/{accountId}/media_2/type/holdmusic/{id}:
    put:
      tags:
      - Media
      summary: Set the hold music on this account to this media storage id.
      description: Used to set the hold music to a different storage id
      operationId: updateAccountMusicOnHold
      parameters:
      - name: X-AUTH-TOKEN
        in: header
        required: false
        schema:
          type: string
      - name: partitionId
        in: path
        description: ID of partition
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        description: ID of account
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: Hold Music storage id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          responseSchema:
            originalRef: HoldMusicX
            $ref: '#/components/schemas/HoldMusicX'
          content:
            application/json:
              schema:
                originalRef: HoldMusicX
                $ref: '#/components/schemas/HoldMusicX'
      responsesObject:
        '200':
          description: successful operation
          responseSchema:
            originalRef: HoldMusicX
            $ref: '#/components/schemas/HoldMusicX'
          schema:
            originalRef: HoldMusicX
            $ref: '#/components/schemas/HoldMusicX'
  /v2/partition/{partitionId}/account/{accountId}/media/{mediaId}:
    get:
      tags:
      - Media
      summary: Retrieve Media of type
      description: Use to retrieve Media of a given type
      operationId: get_2
      parameters:
      - name: X-AUTH-TOKEN
        in: header
