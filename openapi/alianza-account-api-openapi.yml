    Account_2:
      type: object
      properties:
        id:
          type: string
          description: Required to update an account, not required for new account
        partitionId:
          type: string
          description: A partitionId identifies the business entity that this account is a part of.  Refers to <a href="#/~schema/PartitionX">partition.id</a>
        accountNumber:
          type: string
          minLength: 3
          maxLength: 256
          description: The accountNumber is a string that uniquely identifies the account within a partition. AccountNumbers can be used to search for an account.
        accountName:
          type: string
          minLength: 3
          maxLength: 256
          description: The account name is a string that describes the account. The accountName is a field that can be used to identify the account in a search, though it is not required to be unique.
        billingCycleDay:
          type: integer
          format: int32
          minimum: 1
          maximum: 28
          description: The day that marks the start of a billing cycle. Must be between 1 and 28.
        customField:
          type: string
          minLength: 3
          maxLength: 256
          description: Can be used to store generic data for the account.
        status:
          type: string
          description: The status of the account within Alianza's system.  Must be one of [ACTIVE,DISABLED,DELETED,DELETE_PENDING,SUSPENDED,PENDING]
          enum:
          - ACTIVE
          - DISABLED
          - DELETED
          - DELETE_PENDING
          - SUSPENDED
          - PENDING
        timeZone:
          type: string
          description: The IANA Time Zone Database (TZDB) zone id for the account.  Must be a timezone for an area within Alianza's supported regions.
          enum:
          - US/Samoa
          - US/Hawaii
          - US/Alaska
          - US/Pacific
          - US/Arizona
          - US/Mountain
          - US/Central
          - US/Eastern
          - America/St_Thomas
          - Canada/Pacific
          - Canada/Mountain
          - Canada/Central
          - Canada/Eastern
          - Canada/Atlantic
          - Canada/Newfoundland
        languageTag:
          type: string
        deletionDate:
          type: string
          format: date-time
          description: ISO 8601 formatted date string of when the account was deleted. This is a deprecated field as deleted accounts are no longer retained.  This field is present for backwards compatibility with old data.
        accountType:
          type: string
          description: The account type indicates whether the account supports only a single user (SIMPLE) or multiple users (ADVANCED).
          enum:
          - SIMPLE
          - ADVANCED
        platformType:
          type: string
          description: The platform type indicates the features that are supported for the account. CPE1 supports the basic telephone features while CPE2 supports the business cloud communication features. PlatformTypes of V1_0 and V2_0 are deprecated and only present for backwards compatibility.
          enum:
          - V2_0
          - V2_1
          - CPE1
          - CPE2
        platformChangeDate:
          type: string
          format: date-time
        inboundRatePlanProductId:
          type: string
          description: Identifies the inbound rate plan product for the account.  This plan controls how toll free numbers are handled in the account. This field is only required for accounts with toll-free numbers.
        extensionLength:
          type: integer
          format: int32
          minimum: 3
          maximum: 6
          description: Length of extension, not required for accounts with a SIMPLE accountType.
        dialingBehaviorType:
          type: string
          description: Defines how a user would be required to dial in order to place a call. For example, being required to dial 9 before placing a call.
          enum:
          - SEVEN_DIGIT
          - TEN_DIGIT
          - OPEN_DIAL_PLAN
          - DIAL_NINE_SEVEN_DIGIT
          - DIAL_NINE_TEN_DIGIT
          - OPEN_DIAL_PLAN_TEN_DIGIT
        routePlanId:
          type: string
          format: uuid
          description: UUID of the route plan for this account. Route plans determine where outbound calls are routed and are created for a partition by Alianza. The routePlanId must be one that is available on the account's partition. All users on an account will share the same outbound route plan.
        callScreeningSettings:
          $ref: '#/components/schemas/CallScreeningSettingsX_2'
        holdMusicMediaId:
          type: string
          description: Id of the music file to be played when an inbound call is placed on hold.
        holdTimeoutSeconds:
          type: integer
          format: int32
          minimum: 30
          maximum: 600
          description: Time in seconds before a call that has been placed on hold will be terminated. Does not apply to CPE1 platformTypes.
        allowDangerousExtensions:
          type: boolean
          description: Allows extensions starting with 1
        domain:
          type: string
          description: Overrides the partition default branding which is used in the display of end user emails and the end user portal.
        sendWelcomeEmail:
          type: boolean
          description: Specifies if new users added to the account will receive a welcome email.
        regulatoryType:
          type: string
          enum:
          - RESIDENTIAL
          - COMMERCIAL
          - GOVERNMENT
        endUserCount:
          type: integer
          format: int64
          description: Indicates the number of end users associated with this account.
        customHoldMusicMediaId:
          type: string
        callingPlans:
          type: array
          items:
            $ref: '#/components/schemas/CallingPlanX'
          xml:
            wrapped: true
      required:
      - accountName
      - accountNumber
      - accountType
      - billingCycleDay
      - dialingBehaviorType
      - extensionLength
      - id
      - inboundRatePlanProductId
      - partitionId
      - regulatoryType
      - status
      - timeZone
    UserProductPlanX_2:
      type: object
      description: 'A user product plan indicates the platform features that are available to an end user.  There are 3 types: [STANDARD, ADVANCED, PROFESSIONAL]. <p>ADVANCED and PROFESSIONAL plans are only available for ADVANCED account types once a Cymbus group has been created.</p> <span hidden><p><a href="account.html">Accounts</a></p></span> <p><a href="#/~operation/Cymbus%20User%20Product/updateCymbusAccountGroup">Create Cymbus Group</a></p> <h5>STANDARD</h5> <p>The standard plan is available to all users.  It is basic phone service.</p> <h5>ADVANCED</h5> <p>The advanced plan offers the standard phone service plus the Cymbus softphone client. Requires the user have an email address.</p> <h5>PROFESSIONAL</h5> <p>The professional plan includes phone service, Cymbus softphone client, and the Cymbus collaboration features. Requires the user have an email address.</p>'
