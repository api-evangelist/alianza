      parameters:
      - name: X-AUTH-TOKEN
        in: header
        required: false
        schema:
          type: string
      - name: partitionId
        in: path
        description: ID of partition
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        description: ID of account
        required: true
        schema:
          type: string
      - name: limitedData
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: successful operation
          responseSchema:
            type: array
            items:
              originalRef: EndUserV2X
              $ref: '#/components/schemas/EndUserV2X_2'
          content:
            application/json:
              schema:
                type: array
                items:
                  originalRef: EndUserV2X
                  $ref: '#/components/schemas/EndUserV2X_2'
        '400':
          description: Invalid partition or account ID
        '404':
          description: Not found
      responsesObject:
        '200':
          description: successful operation
          responseSchema:
            type: array
            items:
              originalRef: EndUserV2X
              $ref: '#/components/schemas/EndUserV2X_2'
          schema:
            type: array
            items:
              originalRef: EndUserV2X
              $ref: '#/components/schemas/EndUserV2X_2'
        '400':
          description: Invalid partition or account ID
        '404':
          description: Not found
