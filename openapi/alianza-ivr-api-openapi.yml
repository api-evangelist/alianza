components:
  schemas:
    IVRX_2:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        partitionId:
          type: string
        name:
          type: string
        top:
          type: string
        left:
          type: string
        fixedPosition:
          type: boolean
        ivrComponents:
          type: array
          items:
            originalRef: IVRComponentX
            $ref: '#/components/schemas/IVRComponentX_2'
        ivrComponentMappings:
          type: array
          items:
            originalRef: IVRComponentMappingX
