    IVRComponentMappingX_2:
      type: object
      properties:
        fromIvrComponentId:
          type: string
        toIvrComponentId:
          type: string
    IVRComponentX_2:
      type: object
      discriminator:
        propertyName: type
      properties:
        id:
          type: string
        left:
          type: string
        top:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - HANGUP
          - MENU
          - DIRECTORY
          - GROUP
          - INCOMING
          - SCHEDULE
          - DTMF
          - MENU_FAILURE
          - SCHEDULE_RULE_COMPONENT
          - USER
          - LINE_HUNTGROUP
          - FORWARD
  securitySchemes:
