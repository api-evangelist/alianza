safety_notes:
- No idempotency key exists on this API - a retried create tool call can duplicate an account, user, device
  line or telephone-number activation.
- alianza_trigger_port and alianza_add_telephone_number_to_account have carrier-side, externally visible
  consequences and should require human confirmation.
- alianza_delete_account and alianza_delete_end_user are destructive and irreversible through the API.
- See agentic-access/alianza-agentic-access.yml for the per-operation execution contract.
