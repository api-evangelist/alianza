server:
  name: alianza
  transport: stdio
  url: null
  note: CANDIDATE ONLY. This is an API Evangelist proposal derived from Alianza's own published OpenAPI
    3.0.3 description - Alianza does not operate this server. Every tool below is bound to a real operationId
    that exists verbatim in openapi/alianza-openapi-original.yml, and each tool's input schema is that
    operation's parameters plus requestBody.
authentication:
  scheme: apiKey
  header: X-AUTH-TOKEN
  bootstrap_operation: logUserIn
  note: An MCP server would exchange operator-supplied Alianza admin credentials at POST /v2/authorize
    (logUserIn) for an authToken, then set X-AUTH-TOKEN on every downstream call. Almost every tool additionally
    requires a partitionId, and most require an accountId.
scope_note: The source spec exposes 471 operations. A one-tool-per-operation server would be unusable,
  so this candidate curates 40 tools across the marquee service-provider flows. The remaining operations
  are recorded as rest_only in mcp/alianza-tool-crosswalk.yml rather than dropped.
